<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puppet Cube V2 - WASM debug page</title>
<style>
    body { font-family: monospace; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { font-size: 1.2em; }
    #status { color: #e8832d; }
    #heap { color: #5087d0; }
    button { margin: 4px 2px; padding: 6px 14px; background: #2c3a4d; color: #f0f2f5;
             border: 1px solid #5087d0; cursor: pointer; font-family: monospace; }
    button:disabled { opacity: 0.4; cursor: default; }
    #log { white-space: pre-wrap; background: #111; border: 1px solid #333;
           padding: 8px; margin-top: 12px; max-height: 60vh; overflow-y: auto; font-size: 12px; }
    .stage { color: #888d96; } .ready { color: #4ec94e; } .solution { color: #e8832d; }
    .error { color: #e05252; } .scramble { color: #5087d0; }
</style>
</head>
<body>
<h1>Puppet Cube V2 - WASM debug page (step 1)</h1>
<p>
  crossOriginIsolated: <b id="isolated">?</b>
  (needs the coi service worker - reload once if this stays false)<br>
  threads: <b id="threads">-</b>,
  heap: <b id="heap">-</b>,
  <span id="status">loading module ...</span>
</p>
<p>
  <button id="init" disabled>generate tables</button>
  <button id="run" disabled>run scramble tests</button>
  <button id="solve" disabled>solve test position</button>
</p>
<div id="log"></div>

<script src="coi-serviceworker.js"></script>
<script>
'use strict';

const logEl = document.getElementById('log');
function log(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('isolated').textContent = crossOriginIsolated;
if (!crossOriginIsolated) {
    log('NOT cross origin isolated - the pthread module cannot run. ' +
        'The coi service worker should reload the page once (needs http(s), not file://).', 'error');
}

// the test position (run-0 scramble painted as placements) is loaded when
// present, generated by tools/make_placements.py
let testPlacements = null;

const worker = new Worker('worker.js');
worker.onmessage = (msg) => {
    const data = msg.data;
    if (data.type === 'status') {
        if (data.loaded) {
            document.getElementById('status').textContent = 'module loaded';
            document.getElementById('init').disabled = false;
        }
        if (data.heapMB !== undefined) {
            document.getElementById('heap').textContent = data.heapMB.toFixed(0) + ' MB';
        }
        if (data.error) log('worker: ' + data.error, 'error');
    } else if (data.type === 'convert') {
        log('convert_position: ' + JSON.stringify(data.result));
    } else if (data.type === 'error') {
        log('error: ' + data.message, 'error');
    } else if (data.type === 'events') {
        // plain objects (the worker converted the embind instances)
        for (const ev of data.events) {
            const movesCount = ev.moves ? ev.moves.length : 0;
            if (ev.kind === 'stage') log('[stage] ' + ev.text, 'stage');
            else if (ev.kind === 'ready') {
                log(ev.text, 'ready');
                document.getElementById('run').disabled = false;
                document.getElementById('solve').disabled = !testPlacements;
                document.getElementById('status').textContent = 'ready';
                document.getElementById('threads').textContent = 'requested';
            }
            else if (ev.kind === 'scramble') log(`[run ${ev.runIdx}] scramble: ${movesCount} moves`, 'scramble');
            else if (ev.kind === 'solution') log(`[run ${ev.runIdx}] depth ${ev.depth} (${movesCount} moves)`, 'solution');
            else if (ev.kind === 'error') log(ev.text, 'error');
        }
    }
};

document.getElementById('init').onclick = () => {
    document.getElementById('init').disabled = true;
    document.getElementById('status').textContent = 'generating ...';
    worker.postMessage({type: 'init', args: ['-r', '4', '-l', 'warning']});
};
document.getElementById('run').onclick = () => {
    document.getElementById('run').disabled = true;
    worker.postMessage({type: 'run'});
};
document.getElementById('solve').onclick = () => {
    document.getElementById('solve').disabled = true;
    worker.postMessage({type: 'solve', corners: testPlacements.corners, edges: testPlacements.edges});
};

fetch('tests/testdata/run0_placements.json').then(r => {
    if (r.ok) return r.json();
    throw new Error('missing');
}).then(json => {
    testPlacements = json;
    log('test position loaded (run 0)');
}).catch(() => log('no test position (generate with tools/make_placements.py) - solve button disabled', 'stage'));
</script>
</body>
</html>
